[project]
name = "jobfinder"
version = "0.1.0"
description = "Local collector of remote IT vacancies"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "feedparser",
    "selectolax",
    "PyStemmer",
    "nh3",
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
jobfinder = "jobfinder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
