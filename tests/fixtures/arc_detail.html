<html><head></head><body><script id="__NEXT_DATA__" type="application/json" crossorigin="anonymous">{"props":{"pageProps":{"job":{"randomKey":"q09f8t5qke","title":"AI Creative Production Designer (Static \u0026 Short-Form Ad Creative, B2B) - PT - Overlap PST","jobType":"contract","jobRole":"design","availableHoursPerWeek":20,"description":"AI Creative Production Designer\nStatic \u0026 Short-Form Ad Creative | B2B\n\n#### About the company\nClient  is a performance marketing agency running paid acquisition across B2B, e-commerce, and consumer brands. Our creative ships into live campaigns on Meta, YouTube, Google, LinkedIn, and TikTok, and it's judged by how it performs in the market, not how it looks in a deck.\n\nFor a production designer, that means variety: multiple brands (most are B2B AI companies), multiple channels, and a steady flow of real briefs, without having to invent the strategy yourself.\n\n#### THE ROLE\nWe're hiring an AI Creative Production Designer with experience in B2B asset creation to turn creative briefs and iterative creative requests into finished, on-brand ad assets (mostly static images, plus short animations and whitepaper covers) quickly and at volume.\n\nThis is a pure production role. Our Creative Strategists write the briefs and concepts, and our Data Analysts measure how the creative performs. Your job is to execute: take a brief, use AI and production tools to create strong, high-performing ad assets, iterate on feedback, and deliver on time. You'll move across several client accounts each week.\n\n#### ENGAGEMENT\n- Remote, available at least 9am-1pm US Pacific time, Mon-Fri\n- ~20 hrs/week, ongoing\n- Reports to our Chief Growth Officer; day to day with our Creative Strategy team\n\n#### WHAT YOU'LL DRIVE\n- Static ad production: finished static ads from creative briefs across Meta, Google, LinkedIn, TikTok, and display formats\n- Iterations and variants: turn one winning concept into many versions (new backgrounds, products, formats and layouts for the hooks and headlines our strategists write) so we can test faster\n- Short animations: simple motion versions of statics, animated text, product motion, and short AI-generated video clips (6-15 seconds) as needed\n- Gated asset covers: covers for whitepapers, reports and ebooks that match each client's brand\n- Brand consistency: keep each client's colors, fonts, logos, product accuracy, and tone consistent across every asset\n- Platform-ready delivery: export every asset in the right sizes and specs (1:1, 4:5, 9:16, 16:9, and others), clearly named and organized\n- Quality control: catch and fix AI artifacts before delivery, including warped hands, garbled text, off-brand colors, and inaccurate product renders\n- Feedback loops: take notes from strategists and clients and turn revisions around quickly\n\n#### THE IDEAL CANDIDATE\n- Is fluent in AI image tools (in addition to Canva), knows which tool fits which job, and gets consistent, brand-accurate results rather than one-off lucky generations\n- Has a real design eye: strong on layout, typography, and hierarchy, so the final ad reads clearly in a feed and doesn't look AI-generated\n- Is fast and reliable: comfortable producing high volume on a deadline and switching between brands without mixing them up\n- Solves problems proactively: asks smart clarifying questions, then builds what was asked\n- Keeps up with the tools: tries new models and workflows as they come out and brings back what works\n\n#### WHAT YOU NEED\n- 2+ years producing digital or paid social ad creative. Agency or multi-brand experience preferred. B2B experience a plus.\n- A portfolio of AI-assisted static ads or marketing creative\n- Hands-on with AI image tools such as Midjourney, Adobe Firefly / Photoshop Generative Fill, Flux, Ideogram, or similar\n- Hands-on with AI video tools such as Higgsfield, Runway, Kling, Veo or similar. After Effects, Premiere Pro or CapCut is a plus.\n- Strong Canva, Photoshop and/or Figma skills for compositing, retouching, text layout, and cleanup\n- Working knowledge of ad specs and safe zones for Meta, TikTok, YouTube, LinkedIn, and Google\n- Can keep products, logos, and brand elements accurate in AI-generated imagery\n- Consistent availability of ~20 hours per week, with fast, dependable communication\n- Comfortable in Slack and a project management system (we use ClickUp; prior ClickUp experience isn't required)\n\n#### NICE TO HAVE\n- Reusable AI workflows (prompt libraries, style references, ComfyUI pipelines) that keep a brand consistent at scale\n- Experience with UGC-style or performance-style ad creative\n- Exposure to creative testing, so you understand why we ask for many variants\n\n#### WHAT SUCCESS LOOKS LIKE\n- Assets delivered on brief and on deadline, in every requested size and spec, clearly named and organized\n- On-brand for each client: correct colors, fonts, logos, and product accuracy\n- No AI artifacts in delivered work\n- Revisions from strategists and clients turned around quickly\n- Tasks and deadlines kept current in ClickUp\n\n#### TO APPLY\nSend your portfolio link along with your resume or profile through Arc. Include 3-5 static ads you made with AI tools, and for one of them, tell us which tools you used, roughly how long it took, and what you did by hand versus with AI. We review every submission and respond to candidates we'd like to speak with within one week.","estimatedWeeks":24,"urlString":"ai-creative-production-designer-static-short-form-ad-creative-b2b-pt-overlap-pst","requiredCountries":[],"englishLevel":null,"visaOrRelocationRequired":null,"overlapHours":5,"minAnnualSalary":null,"maxAnnualSalary":null,"numberOfOpenings":1,"experienceLevel":"senior","requiredLocations":["worldwide"],"jobLink":null,"interviewLink":null,"interviewDescription":null,"interestCount":32,"discipline":"visual-graphic-design","createdAt":1794957846,"updatedAt":1794968484,"startAt":1794957846,"state":"opened","aasmState":"open","
